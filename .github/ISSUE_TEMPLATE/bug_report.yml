name: Bug report
description: Report a reproducible problem in iLoveMd
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include private documents, credentials, or personal data.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Tell us exactly how to reproduce the problem.
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 140"
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system
      placeholder: "Windows 11"
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: Minimal Markdown sample
      description: Include the smallest safe sample that reproduces the issue, or explain why none is available.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and artifacts
      description: Share visible diagnostics, console errors, screenshots, or export details after removing sensitive data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed private documents, credentials, and personal data.
          required: true
